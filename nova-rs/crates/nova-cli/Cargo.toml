[package]
name = "nova-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Headless driver for the Nova engine: run and observe the learner, the evolver and the strategy emitter without the GUI."

# `nova-engine`, not `nova`. NovaInstaller.iss:148 does
# `Get-Process -Name Nova` and :157 `taskkill /F /IM Nova.exe` to clear install
# blockers, and both match on image name, case-insensitively. A helper called
# `nova.exe` would therefore be killed on every install and uninstall — and,
# worse, would convince the installer that Nova itself is running, which fires
# the WinDivert and CloudflareWARP service stops even when the app is closed.
[[bin]]
name = "nova-engine"
path = "src/main.rs"

[dependencies]
nova-core = { workspace = true }
nova-learn = { workspace = true }
nova-zapret = { workspace = true }
nova-cloudflare = { workspace = true }
nova-health = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
